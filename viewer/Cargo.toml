[package]
name = "protohdmicapture"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Low-latency HDMI capture card viewer"
repository = "https://github.com/mattiasbrandt/protoHDMIcapture"
homepage = "https://github.com/mattiasbrandt/protoHDMIcapture"
readme = "../README.md"
keywords = ["hdmi", "capture-card", "v4l2", "viewer", "low-latency"]
categories = ["multimedia::video"]

[dependencies]
cpal = "0.18"
ctrlc = { version = "3.5.2", features = ["termination"] }
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
libc = "0.2.190"
png = "0.18.1"
pollster = "1.0.1"
raw-window-handle = "0.6"
regex = "1.13.1"
serde_json = "1.0.154"
wgpu = "30"
winit = "0.30"
zune-jpeg = "0.5.15"

# The platform parts (#18): V4L2, PipeWire and Wayland on Linux; Media
# Foundation on Windows (WASAPI comes through cpal, DX12 through wgpu).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire", "realtime-dbus"] }
linuxvideo = "=0.3.5"
pipewire = "0.10"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
# windows-core for the #[implement] macro's generated paths.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1

# linuxvideo 0.3.5 with each buffer's timestamp and sequence number exposed;
# the diff is vendor/linuxvideo-timestamp-sequence.patch (to offer upstream).
[patch.crates-io]
linuxvideo = { path = "vendor/linuxvideo" }

[dev-dependencies]
jpeg-encoder = "0.7.1"

[build-dependencies]
embed-resource = "3.0.12"
