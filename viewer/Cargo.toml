[package]
name = "protohdmicapture"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Low-latency HDMI capture card viewer"
repository = "https://github.com/mattiasbrandt/protoHDMIcapture"
homepage = "https://github.com/mattiasbrandt/protoHDMIcapture"
readme = "../README.md"
keywords = ["hdmi", "capture-card", "v4l2", "viewer", "low-latency"]
categories = ["multimedia::video"]

[dependencies]
cpal = { version = "0.18", features = ["pipewire", "realtime-dbus"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
libc = "0.2.190"
linuxvideo = "=0.3.5"
pipewire = "0.10"
png = "0.18.1"
pollster = "1.0.1"
raw-window-handle = "0.6"
regex = "1.13.1"
serde_json = "1.0.154"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wgpu = "30"
winit = "0.30"
zune-jpeg = "0.5.15"

[profile.release]
debug = 1

# linuxvideo 0.3.5 with each buffer's timestamp and sequence number exposed;
# the diff is vendor/linuxvideo-timestamp-sequence.patch (to offer upstream).
[patch.crates-io]
linuxvideo = { path = "vendor/linuxvideo" }

[dev-dependencies]
jpeg-encoder = "0.7.1"
