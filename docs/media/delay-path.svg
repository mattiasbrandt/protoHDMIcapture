<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d">
<title id="t">Where the delay is</title>
<desc id="d">An HDMI source such as a console sends its picture over HDMI to the capture card, the card sends it over USB to the PC, and protoHDMIcapture shows it on the monitor. The card's own processing is the largest delay; protoHDMIcapture's part is kept as short as possible; the monitor adds its own. The card's HDMI loop-out to a TV or monitor adds no delay.</desc>
<rect width="880" height="330" rx="16" fill="#1D1F22"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="30" y="150" width="150" height="76" rx="10" fill="none" stroke="#ECEAE4" stroke-width="2"/>
<text x="105.0" y="184" fill="#ECEAE4" font-size="17" font-weight="600" text-anchor="middle">HDMI source</text>
<text x="105.0" y="206" fill="#9A978F" font-size="13" text-anchor="middle">console, PC, camera</text>
<rect x="255" y="150" width="150" height="76" rx="10" fill="none" stroke="#ECEAE4" stroke-width="2"/>
<text x="330.0" y="194" fill="#ECEAE4" font-size="17" font-weight="600" text-anchor="middle">Capture card</text>
<rect x="480" y="150" width="150" height="76" rx="10" fill="none" stroke="#3FBF6A" stroke-width="2"/>
<text x="555.0" y="184" fill="#ECEAE4" font-size="17" font-weight="600" text-anchor="middle">PC</text>
<text x="555.0" y="206" fill="#3FBF6A" font-size="13" text-anchor="middle">protoHDMIcapture</text>
<rect x="700" y="150" width="150" height="76" rx="10" fill="none" stroke="#ECEAE4" stroke-width="2"/>
<text x="775.0" y="194" fill="#ECEAE4" font-size="17" font-weight="600" text-anchor="middle">Monitor</text>
<line x1="186" y1="188.0" x2="241" y2="188.0" stroke="#9A978F" stroke-width="2"/>
<path d="M239,182.0 L249,188.0 L239,194.0 Z" fill="#9A978F"/>
<text x="217.5" y="178.0" fill="#9A978F" font-size="11" text-anchor="middle">HDMI</text>
<line x1="411" y1="188.0" x2="466" y2="188.0" stroke="#9A978F" stroke-width="2"/>
<path d="M464,182.0 L474,188.0 L464,194.0 Z" fill="#9A978F"/>
<text x="442.5" y="178.0" fill="#9A978F" font-size="11" text-anchor="middle">USB</text>
<line x1="636" y1="188.0" x2="686" y2="188.0" stroke="#9A978F" stroke-width="2"/>
<path d="M684,182.0 L694,188.0 L684,194.0 Z" fill="#9A978F"/>
<text x="665.0" y="178.0" fill="#9A978F" font-size="11" text-anchor="middle">DP or HDMI</text>
<line x1="330.0" y1="144" x2="330.0" y2="78" stroke="#9A978F" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="260.0" y="26" width="140" height="48" rx="8" fill="none" stroke="#9A978F" stroke-width="2"/>
<text x="330.0" y="56" fill="#ECEAE4" font-size="15" text-anchor="middle">TV or monitor</text>
<text x="412.0" y="46" fill="#9A978F" font-size="13">HDMI loop-out:</text>
<text x="412.0" y="64" fill="#9A978F" font-size="13">no added delay</text>
<path d="M263,244 v8 h134 v-8" fill="none" stroke="#ECEAE4" stroke-width="2"/>
<text x="330.0" y="276" fill="#ECEAE4" font-size="13" text-anchor="middle">the card's own delay:</text>
<text x="330.0" y="294" fill="#ECEAE4" font-size="13" text-anchor="middle">the largest part</text>
<path d="M488,244 v8 h134 v-8" fill="none" stroke="#3FBF6A" stroke-width="2"/>
<text x="555.0" y="276" fill="#3FBF6A" font-size="13" text-anchor="middle">protoHDMIcapture:</text>
<text x="555.0" y="294" fill="#3FBF6A" font-size="13" text-anchor="middle">as short as possible</text>
<path d="M708,244 v8 h134 v-8" fill="none" stroke="#ECEAE4" stroke-width="2"/>
<text x="775.0" y="276" fill="#ECEAE4" font-size="13" text-anchor="middle">the monitor's own</text>
<text x="775.0" y="294" fill="#ECEAE4" font-size="13" text-anchor="middle">processing</text>
</g></svg>
