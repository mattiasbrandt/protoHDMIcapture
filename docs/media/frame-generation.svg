<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="t d">
<title id="t">Frame generation: 30 fps shown at 60</title>
<desc id="d">Two rows cover the same stretch of time. The top row, a 30 fps game, has four pictures. The bottom row, with frame generation, has eight: the same four from the game, and one made by your graphics card between each pair.</desc>
<rect width="880" height="290" rx="16" fill="#1D1F22"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<text x="32" y="76" fill="#ECEAE4" font-size="17" font-weight="600">A 30 fps game</text>
<text x="32" y="98" fill="#9A978F" font-size="14">4 pictures</text>
<line x1="266" y1="80" x2="834" y2="80" stroke="#3A3D42" stroke-width="2"/>
<path d="M834,74 L844,80 L834,86 Z" fill="#3A3D42"/>
<circle cx="290.0" cy="80" r="11" fill="#ECEAE4" opacity="0.35"/>
<circle cx="438.6" cy="80" r="11" fill="#ECEAE4" opacity="0.57"/>
<circle cx="587.1" cy="80" r="11" fill="#ECEAE4" opacity="0.78"/>
<circle cx="735.7" cy="80" r="11" fill="#ECEAE4" opacity="1.00"/>
<text x="32" y="166" fill="#ECEAE4" font-size="17" font-weight="600">With frame generation</text>
<text x="32" y="188" fill="#9A978F" font-size="14">8 pictures, at 60 fps</text>
<line x1="266" y1="170" x2="834" y2="170" stroke="#3A3D42" stroke-width="2"/>
<path d="M834,164 L844,170 L834,176 Z" fill="#3A3D42"/>
<circle cx="290.0" cy="170" r="11" fill="#ECEAE4" opacity="0.35"/>
<circle cx="364.3" cy="170" r="11" fill="#3FBF6A" opacity="0.44"/>
<circle cx="438.6" cy="170" r="11" fill="#ECEAE4" opacity="0.54"/>
<circle cx="512.9" cy="170" r="11" fill="#3FBF6A" opacity="0.63"/>
<circle cx="587.1" cy="170" r="11" fill="#ECEAE4" opacity="0.72"/>
<circle cx="661.4" cy="170" r="11" fill="#3FBF6A" opacity="0.81"/>
<circle cx="735.7" cy="170" r="11" fill="#ECEAE4" opacity="0.91"/>
<circle cx="810.0" cy="170" r="11" fill="#3FBF6A" opacity="1.00"/>
<text x="844" y="210" fill="#9A978F" font-size="13" text-anchor="end">time →</text>
<circle cx="208" cy="256" r="8" fill="#ECEAE4"/><text x="224" y="261" fill="#ECEAE4" font-size="14">a picture from the game</text>
<circle cx="440" cy="256" r="8" fill="#3FBF6A"/><text x="456" y="261" fill="#ECEAE4" font-size="14">made by your graphics card, in between</text>
</g></svg>
