# The release packages (#14). A v* tag:
#   draft    creates the GitHub release as a draft (or finds it on a re-run);
#   archive  builds the Linux archive (packaging/release-archive.sh, on Arch);
#   msi      builds the Windows installer (packaging/windows/build-msi.ps1:
#            WiX 7, ICE validation) and smoke-tests it (test-msi.ps1: install,
#            check, uninstall) on Windows;
#   publish  adds SHA256SUMS over every asset and publishes the release.
# Nothing is public until every asset is in: a failed job leaves a draft,
# and a re-run replaces its assets (--clobber). The PKGBUILD and AUR half of
# #14 stays by hand (updpkgsums, .SRCINFO, the AUR push).
# Linux packages: the viewer's build (as check.yml), python3 for the
# script's cargo-metadata parse, binutils for strip, github-cli for the
# upload. Windows: the runner's Rust (latest stable), Visual Studio (link.exe;
# rc.exe for the icon), .NET for WiX 7 as a dotnet tool, and gh.
# WiX 7's Open Source Maintenance Fee EULA is accepted for this project in
# build-msi.ps1 (see there).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes

  archive:
    needs: draft
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli python binutils \
            rustup gcc clang pkgconf \
            libpipewire alsa-lib dbus wayland

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in check.yml: the container's root over the runner's checkout.
      - name: Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Archive
        run: packaging/release-archive.sh dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber

  msi:
    needs: draft
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"

      - name: Installer
        run: packaging/windows/build-msi.ps1 -OutDir dist

      # Installs it for the runner's user, checks the files, the Start menu
      # shortcut and its key, runs the exe, uninstalls and checks it is gone;
      # a failure prints the installation log's end.
      - name: Smoke test
        run: packaging/windows/test-msi.ps1 -Msi (Get-ChildItem dist/*.msi).FullName -Log "$env:RUNNER_TEMP/install.log"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG (Get-ChildItem dist/*.msi).FullName --clobber

  publish:
    needs: [archive, msi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern '*.tar.gz' --pattern '*.msi'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
