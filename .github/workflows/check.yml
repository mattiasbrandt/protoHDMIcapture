# tools/check on every push and pull request to main (#25), on Arch, which
# the project targets. The packages are exactly what tools/check calls:
#   git                      tools/check's file lists (git ls-files)
#   diffutils                tools/capture-cards-table --check (diff)
#   shellcheck, lua, python  the shell, Lua and Python checks
#   rustup, gcc, clang, pkgconf
#                            the viewer: cargo, rustfmt and clippy; cc for libspa-sys's
#                            C wrappers, clang for bindgen (PipeWire), pkgconf
#                            to find the libraries below
#   libpipewire, alsa-lib, dbus, wayland
#                            the libraries the viewer links (packaging/INSTALL.md)
#   util-linux               flock, which session.rs's tests take the lock
#                            with
# protoHDMIcapture legacy (legacy/) gets the shell, Lua and Python checks
# only; its harnesses run by hand (ADR 0002).
# The Windows clippy step runs too: the x86_64-pc-windows-msvc target is
# added, and clippy links nothing, so no Windows SDK is needed (#18).
# Actions are pinned to commit SHAs; Dependabot moves them
# (.github/dependabot.yml).
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # From release-please.yml, on its release PR's branch: a PR opened with
  # GITHUB_TOKEN starts no workflow, so this is how it gets checked.
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

# A newer push to the same ref makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Not on the release PR's own pull_request event: release-please.yml
    # checks that branch itself (workflow_call), and its merge deletes the
    # branch under this run, which then fails with no jobs (#60).
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    container: archlinux:latest
    # A cold run takes ~5.5 min.
    timeout-minutes: 20
    steps:
      # Before the checkout, so that it is a git clone and not a tarball.
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed \
            git diffutils shellcheck lua python \
            rustup gcc clang pkgconf \
            libpipewire alsa-lib dbus wayland \
            util-linux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The container runs as root over a workspace owned by the runner's
      # user: without this, git refuses it ("dubious ownership") and
      # tools/check's file lists come back empty.
      - name: Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      # Its key includes rustc's version, so a new stable does not restore a
      # target it then rebuilds and never saves; saved after a red run too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: tools/check
        run: tools/check

      # tools/check names a failing test, not its output; a red run shows
      # them in full here.
      - name: Failing tests, in full
        if: failure()
        run: cargo test --no-fail-fast
