# tools/check on every push and pull request to main (#25), on Arch, which
# the project targets. The packages are exactly what tools/check calls:
#   git                      tools/check's file lists (git ls-files)
#   diffutils                tools/capture-cards-table --check (diff)
#   shellcheck, lua, python  the shell, Lua and Python checks
#   rustup, gcc, clang, pkgconf
#                            the viewer: cargo and clippy; cc for libspa-sys's
#                            C wrappers, clang for bindgen (PipeWire), pkgconf
#                            to find the libraries below
#   libpipewire, alsa-lib, dbus, wayland
#                            the libraries the viewer links (packaging/INSTALL.md)
#   util-linux               flock, which session.rs's tests take the lock
#                            with
# protoHDMIcapture legacy (legacy/) gets the shell, Lua and Python checks
# only; its harnesses run by hand (ADR 0002).
# The Windows clippy step runs too: the x86_64-pc-windows-msvc target is
# added, and clippy links nothing, so no Windows SDK is needed (#18).
# Actions are pinned to commit SHAs; Dependabot moves them
# (.github/dependabot.yml).
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    # The repo is private, so minutes are metered; a cold run takes ~5.5 min.
    timeout-minutes: 20
    steps:
      # Before the checkout, so that it is a git clone and not a tarball.
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed \
            git diffutils shellcheck lua python \
            rustup gcc clang pkgconf \
            libpipewire alsa-lib dbus wayland \
            util-linux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The container runs as root over a workspace owned by the runner's
      # user: without this, git refuses it ("dubious ownership") and
      # tools/check's file lists come back empty.
      - name: Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      # Its key includes rustc's version, so a new stable does not restore a
      # target it then rebuilds and never saves; saved after a red run too.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: viewer -> target
          cache-on-failure: true

      - name: tools/check
        run: tools/check

      # tools/check runs the tests quietly ("rerun it to see which"); here
      # nobody can rerun them, so a red run shows them in full.
      - name: Failing tests, in full
        if: failure()
        run: cargo test --manifest-path viewer/Cargo.toml --no-fail-fast
