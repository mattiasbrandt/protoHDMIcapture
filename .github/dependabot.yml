# The workflows' actions are pinned to commit SHAs; this moves the pins.
# Cargo too, weekly: egui, wgpu, winit and their crates move together in
# one PR (an egui release names the wgpu it needs), everything else in
# another. The PR titles are Conventional Commits (build(deps): …), so a
# dependency update alone makes no release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # Vendored with our patch (Cargo.toml [patch.crates-io]): moved by hand.
    ignore:
      - dependency-name: linuxvideo
      # Must be the windows-core the windows crate uses (#[implement] takes
      # its types): moved by hand, with windows. windows-core 0.100 has no
      # windows to go with it (PR #58 broke the Windows build).
      - dependency-name: windows-core
    groups:
      graphics:
        patterns:
          - "egui*"
          - "epaint*"
          - "emath"
          - "ecolor"
          - "wgpu*"
          - "naga*"
          - "winit"
          - "raw-window-handle"
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "egui*"
          - "epaint*"
          - "emath"
          - "ecolor"
          - "wgpu*"
          - "naga*"
          - "winit"
          - "raw-window-handle"
